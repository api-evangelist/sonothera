aid: sonothera
name: SonoThera
description: >-
  SonoThera, Inc. is a privately held, clinical-stage biotechnology company headquartered at 201
  Haskins Way in South San Francisco, California, founded in 2022 to make genetic medicine
  deliverable without a viral vector. Its RIPPLE platform pairs an intravenously administered
  lipid-and-microbubble formulation with an externally applied diagnostic ultrasound probe: the
  acoustic energy transiently permeabilizes cell membranes in the targeted organ so a nucleic-acid
  payload enters only where the probe is pointed, an approach built on the roughly 35 million
  ultrasound contrast-agent doses given safely each year in cardiac imaging. A companion payload
  engineering platform, PORE, carries DNA and RNA constructs, gene editing and gene silencing
  cargo of varied size and format. The company holds an exclusive license to GE HealthCare's
  Optison and Sonazoid microbubble products for use with the platform, and has raised
  approximately $186 million — a $60.75 million Series A and an oversubscribed $125 million
  Series B — from ARCH Venture Partners, Johnson & Johnson, Illumina Ventures and Eli Lilly, to
  push lead programs in Duchenne muscular dystrophy and autosomal dominant polycystic kidney
  disease into the clinic, with preclinical work in Alport syndrome and hemophilia A. It was
  co-founded by Kenneth Greenberg (CEO), Steve Feinstein (Chief Scientific Officer) and
  Michael H. Davidson (Executive Chairman). SonoThera sells therapeutics, not software: it runs no
  developer program, publishes no API, SDK or machine-readable specification, and maintains no
  public source-code organization.
